# @i18n:batch.config.overview.overview
# @i18n:batch.config.overview.paths
# @i18n:batch.config.overview.check_only
# @i18n:batch.config.overview.defaults
# @i18n:batch.config.overview.metadata
# @i18n:batch.config.overview.forum_home
namespace: default # @i18n:batch.config.global.namespace
download_base: downloads # @i18n:batch.config.global.download_base
incremental: false # @i18n:batch.config.global.incremental
write_metadata: true # @i18n:batch.config.global.write_metadata
overlap_seconds: 3600 # @i18n:batch.config.global.overlap_seconds
pool: 16 # @i18n:batch.config.global.pool
threads: 8 # @i18n:batch.config.global.threads
limit: 4 # @i18n:batch.config.global.limit
jobs: # @i18n:batch.config.global.jobs
  # @i18n:batch.config.examples.direct_range.summary
  # @i18n:batch.config.examples.direct_range.single_message
  - chat_url: https://t.me/example_channel/100 # @i18n:batch.config.jobs.direct_range.chat_url
    comment: false # @i18n:batch.config.jobs.direct_range.comment
    start_comment: 100 # @i18n:batch.config.jobs.direct_range.start_comment
    end_comment: 110 # @i18n:batch.config.jobs.direct_range.end_comment
    subdir: 01-direct-range # @i18n:batch.config.jobs.direct_range.subdir

  # @i18n:batch.config.examples.comment_range.summary
  # @i18n:batch.config.examples.comment_range.discussion_scope
  - chat_url: https://t.me/example_channel/100 # @i18n:batch.config.jobs.comment_range.chat_url
    comment: true # @i18n:batch.config.jobs.comment_range.comment
    start_comment: 900 # @i18n:batch.config.jobs.comment_range.start_comment
    end_comment: 910 # @i18n:batch.config.jobs.comment_range.end_comment
    subdir: 02-comment-range # @i18n:batch.config.jobs.comment_range.subdir

  # @i18n:batch.config.examples.incremental_chat.summary
  # @i18n:batch.config.examples.incremental_chat.lookback
  - chat_url: https://t.me/example_channel # @i18n:batch.config.jobs.incremental_chat.chat_url
    comment: false # @i18n:batch.config.jobs.incremental_chat.comment
    incremental: true # @i18n:batch.config.jobs.incremental_chat.incremental
    overlap_seconds: 3600 # @i18n:batch.config.jobs.incremental_chat.overlap_seconds
    export_filter: "" # @i18n:batch.config.jobs.incremental_chat.export_filter
    with_content: true # @i18n:batch.config.jobs.incremental_chat.with_content
    export_all: false # @i18n:batch.config.jobs.incremental_chat.export_all
    subdir: 03-incremental-chat # @i18n:batch.config.jobs.incremental_chat.subdir

  # @i18n:batch.config.examples.incremental_topic.summary
  # @i18n:batch.config.examples.incremental_topic.explicit_topic
  - chat_url: https://t.me/example_forum # @i18n:batch.config.jobs.incremental_topic.chat_url
    comment: false # @i18n:batch.config.jobs.incremental_topic.comment
    incremental: true # @i18n:batch.config.jobs.incremental_topic.incremental
    topic_id: 200 # @i18n:batch.config.jobs.incremental_topic.topic_id
    with_content: true # @i18n:batch.config.jobs.incremental_topic.with_content
    subdir: 04-incremental-topic # @i18n:batch.config.jobs.incremental_topic.subdir

  # @i18n:batch.config.examples.incremental_comments.summary
  # @i18n:batch.config.examples.incremental_comments.reply_id
  # @i18n:batch.config.examples.incremental_comments.same_group
  - chat_url: https://t.me/example_channel/100 # @i18n:batch.config.jobs.incremental_comments.chat_url
    chat: https://t.me/example_discussion # @i18n:batch.config.jobs.incremental_comments.chat
    comment: true # @i18n:batch.config.jobs.incremental_comments.comment
    incremental: true # @i18n:batch.config.jobs.incremental_comments.incremental
    reply_post_id: 900 # @i18n:batch.config.jobs.incremental_comments.reply_post_id
    with_content: true # @i18n:batch.config.jobs.incremental_comments.with_content
    subdir: 05-incremental-comments # @i18n:batch.config.jobs.incremental_comments.subdir

  # @i18n:batch.config.examples.tag_single.summary
  # @i18n:batch.config.examples.tag_single.album_match
  # @i18n:batch.config.examples.tag_single.history_limit
  - chat_url: https://t.me/example_channel # @i18n:batch.config.jobs.tag_single.chat_url
    tag: '#教程' # @i18n:batch.config.jobs.tag_single.tag
    max_posts: 1 # @i18n:batch.config.jobs.tag_single.max_posts
    subdir: 06-tag-single # @i18n:batch.config.jobs.tag_single.subdir

  # @i18n:batch.config.examples.tags_any.summary
  # @i18n:batch.config.examples.tags_any.metadata
  - chat_url: https://t.me/example_channel # @i18n:batch.config.jobs.tags_any.chat_url
    tags: # @i18n:batch.config.jobs.tags_any.tags
      - '#教程'
      - '#示例'
    tag_match: any # @i18n:batch.config.jobs.tags_any.tag_match
    start_comment: 100 # @i18n:batch.config.jobs.tags_any.start_comment
    end_comment: 110 # @i18n:batch.config.jobs.tags_any.end_comment
    write_metadata: false # @i18n:batch.config.jobs.tags_any.write_metadata
    max_posts: 1 # @i18n:batch.config.jobs.tags_any.max_posts
    subdir: 07-tags-any # @i18n:batch.config.jobs.tags_any.subdir

  # @i18n:batch.config.examples.tags_all.summary
  # @i18n:batch.config.examples.tags_all.timestamp_window
  - chat_url: https://t.me/example_channel # @i18n:batch.config.jobs.tags_all.chat_url
    tags: # @i18n:batch.config.jobs.tags_all.tags
      - '#教程'
      - '#示例'
    tag_match: all # @i18n:batch.config.jobs.tags_all.tag_match
    incremental: true # @i18n:batch.config.jobs.tags_all.incremental
    max_posts: 0 # @i18n:batch.config.jobs.tags_all.max_posts
    subdir: 08-tags-all # @i18n:batch.config.jobs.tags_all.subdir

  # @i18n:batch.config.examples.linked_single.summary
  # @i18n:batch.config.examples.linked_single.multi_hop
  # @i18n:batch.config.examples.linked_single.source_url
  - chat_url: https://t.me/example_channel/100 # @i18n:batch.config.jobs.linked_single.chat_url
    follow_links: true # @i18n:batch.config.jobs.linked_single.follow_links
    incremental: false # @i18n:batch.config.jobs.linked_single.incremental
    subdir: 09-linked-single # @i18n:batch.config.jobs.linked_single.subdir
    link_options: # @i18n:batch.config.jobs.linked_single.link_options
      # @i18n:batch.config.examples.linked_single.link_options.defaults
      # @i18n:batch.config.examples.linked_single.link_options.retry_limits
      # @i18n:batch.config.examples.linked_single.link_options.request_interval
      # @i18n:batch.config.examples.linked_single.link_options.disable_retries
      scan_comments: true # @i18n:batch.config.jobs.linked_single.link_options.scan_comments
      comment_limit: 100 # @i18n:batch.config.jobs.linked_single.link_options.comment_limit
      include_previews: true # @i18n:batch.config.jobs.linked_single.link_options.include_previews
      cleanup_bot_messages: true # @i18n:batch.config.jobs.linked_single.link_options.cleanup_bot_messages
      max_depth: 8 # @i18n:batch.config.jobs.linked_single.link_options.max_depth
      max_links: 100 # @i18n:batch.config.jobs.linked_single.link_options.max_links
      bot_timeout_seconds: 60 # @i18n:batch.config.jobs.linked_single.link_options.bot_timeout_seconds
      bot_idle_seconds: 3 # @i18n:batch.config.jobs.linked_single.link_options.bot_idle_seconds
      bot_request_interval_seconds: 0 # @i18n:batch.config.jobs.linked_single.link_options.bot_request_interval_seconds
      poll_interval_ms: 500 # @i18n:batch.config.jobs.linked_single.link_options.poll_interval_ms
      max_bot_messages: 500 # @i18n:batch.config.jobs.linked_single.link_options.max_bot_messages
      max_topic_messages: 1000 # @i18n:batch.config.jobs.linked_single.link_options.max_topic_messages
      rerequest_limit: 3 # @i18n:batch.config.jobs.linked_single.link_options.rerequest_limit
      flood_retries: 5 # @i18n:batch.config.jobs.linked_single.link_options.flood_retries
      flood_wait_seconds: 30 # @i18n:batch.config.jobs.linked_single.link_options.flood_wait_seconds
      max_flood_wait_seconds: 3600 # @i18n:batch.config.jobs.linked_single.link_options.max_flood_wait_seconds

  # @i18n:batch.config.examples.linked_comments.summary
  # @i18n:batch.config.examples.linked_comments.post_limit
  - chat_url: https://t.me/example_channel # @i18n:batch.config.jobs.linked_comments.chat_url
    follow_links: true # @i18n:batch.config.jobs.linked_comments.follow_links
    incremental: true # @i18n:batch.config.jobs.linked_comments.incremental
    max_posts: 0 # @i18n:batch.config.jobs.linked_comments.max_posts
    subdir: 10-linked-comments # @i18n:batch.config.jobs.linked_comments.subdir
    link_options: # @i18n:batch.config.jobs.linked_comments.link_options
      scan_comments: true # @i18n:batch.config.jobs.linked_comments.link_options.scan_comments
      cleanup_bot_messages: true # @i18n:batch.config.jobs.linked_comments.link_options.cleanup_bot_messages

  # @i18n:batch.config.examples.linked_filtered.summary
  # @i18n:batch.config.examples.linked_filtered.bot_interval
  # @i18n:batch.config.examples.linked_filtered.bot_timing
  - chat_url: https://t.me/example_channel # @i18n:batch.config.jobs.linked_filtered.chat_url
    follow_links: true # @i18n:batch.config.jobs.linked_filtered.follow_links
    incremental: false # @i18n:batch.config.jobs.linked_filtered.incremental
    start_comment: 100 # @i18n:batch.config.jobs.linked_filtered.start_comment
    end_comment: 110 # @i18n:batch.config.jobs.linked_filtered.end_comment
    tags: # @i18n:batch.config.jobs.linked_filtered.tags
      - '#教程'
      - '#示例'
    tag_match: any # @i18n:batch.config.jobs.linked_filtered.tag_match
    max_posts: 1 # @i18n:batch.config.jobs.linked_filtered.max_posts
    subdir: 11-linked-filtered # @i18n:batch.config.jobs.linked_filtered.subdir
    link_options: # @i18n:batch.config.jobs.linked_filtered.link_options
      max_depth: 8 # @i18n:batch.config.jobs.linked_filtered.link_options.max_depth
      bot_timeout_seconds: 120 # @i18n:batch.config.jobs.linked_filtered.link_options.bot_timeout_seconds
      bot_idle_seconds: 10 # @i18n:batch.config.jobs.linked_filtered.link_options.bot_idle_seconds
      bot_request_interval_seconds: 30 # @i18n:batch.config.jobs.linked_filtered.link_options.bot_request_interval_seconds
      rerequest_limit: 3 # @i18n:batch.config.jobs.linked_filtered.link_options.rerequest_limit
      flood_retries: 5 # @i18n:batch.config.jobs.linked_filtered.link_options.flood_retries
      cleanup_bot_messages: true # @i18n:batch.config.jobs.linked_filtered.link_options.cleanup_bot_messages
